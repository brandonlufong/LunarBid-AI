# API on Render (render.com → New → Blueprint → select this repository). Serves https://api.lunarbid.ai.
# Region: Frankfurt (closest Render region to Cameroon; put MongoDB Atlas in AWS eu-central-1 to match).
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: lunarbid-api
    runtime: node
    rootDir: backend
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: TRUST_PROXY
        value: "1"
      # --- Free-beta controls (non-secret; server-enforced in config/beta.js) ---
      # Beta mode on, online payments OFF. Flip BILLING_ENABLED to "true" only when billing is live.
      - key: BETA_MODE
        value: "true"
      - key: BILLING_ENABLED
        value: "false"
      - key: AI_GENERATION_ENABLED
        value: "true"        # emergency kill switch: set "false" to pause all AI generation
      # Protective per-user caps + global AI spend ceilings (USD). Safe defaults; tune as needed.
      - key: BETA_DAILY_PROPOSALS
        value: "3"
      - key: BETA_MONTHLY_PROPOSALS
        value: "15"
      - key: AI_DAILY_SPEND_CEILING_USD
        value: "5"
      - key: AI_MONTHLY_SPEND_CEILING_USD
        value: "50"
      # Keep registration OPEN only once production email (Resend) is verified working; else set "false".
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Primary email transport (Resend HTTPS API). Enter the key in the Render dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: S3_REGION
        value: auto
      - key: TOGETHER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: Google / GitHub sign-in (leave unset to keep it off)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Stripe variables above remain until billing moves to Paddle (planned; not implemented yet).
